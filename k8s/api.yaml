apiVersion: v1
kind: ConfigMap
metadata:
  name: student-api-config
  namespace: student-app
data:
  MONGO_URI: mongodb://mongo:27017/studentdb
  PORT: "5000"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-api
  namespace: student-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: student-api
  template:
    metadata:
      labels:
        app: student-api
    spec:
      containers:
        - name: student-api
          image: ghcr.io/abhinavsaxena2308/student-api:latest
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: student-api-config
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: student-api
  namespace: student-app
spec:
  type: NodePort
  selector:
    app: student-api
  ports:
    - port: 80
      targetPort: 5000
      nodePort: 30080
